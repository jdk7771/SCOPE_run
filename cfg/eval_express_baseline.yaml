# Full EXPRESS-Bench (2,044 questions) using the 5cm SCOPE baseline.
seed: 3407
exp_name: "express_baseline_5cm"
output_parent_dir: "/data1/jiangdakun/scope_results"
scene_dataset_config_path: "data/hm3d_annotated_basis.scene_dataset_config.json"
scene_data_path: "/data1/jiangdakun/hm3d"
questions_list_path: "/data1/liuyaxuan/EXPRESS-Bench/EXPRESS-Bench/data/express-bench.json"
concept_graph_config_path: "cfg/concept_graph_default.yaml"

choose_every_step: true
egocentric_views: true
prefiltering: true
top_k_categories: 10

yolo_model_name: "/data1/jiangdakun/scope_weights/ultralytics/yolov8x-world.pt"
sam_model_name: "/data1/jiangdakun/scope_weights/ultralytics/sam_l.pt"
class_set: scannet200
min_detection: 1

camera_height: 1.5
camera_tilt_deg: -30
img_width: 1280
img_height: 1280
hfov: 120
save_visualization: false
prompt_h: 360
prompt_w: 360

# Retain the SCOPE A-EQA exploration budget rather than consuming EXPRESS's
# reference trajectory or its ground-truth goal during exploration.
num_step: 50
init_clearance: 0.3
extra_view_phase_1: 2
extra_view_angle_deg_phase_1: 60
extra_view_phase_2: 6
extra_view_angle_deg_phase_2: 40

explored_depth: 1.7
tsdf_grid_size: 0.05
margin_w_ratio: 0.25
margin_h_ratio: 0.6
planner:
  frontier_neighbor_radius_m: 0.10
  frontier_area_unknown_fraction_min: 1.00
  frontier_area_unknown_fraction_max: 1.00
  frontier_edge_unknown_fraction_min: 0.50
  frontier_edge_unknown_fraction_max: 0.75
  frontier_cluster_eps_m: 0.10
  min_frontier_area_m2: 0.20
  eps: 1
  max_dist_from_cur_phase_1: 1
  max_dist_from_cur_phase_2: 1
  final_observe_distance: 0.75
  surrounding_explored_radius: 0.7
  frontier_edge_area_min: 4
  frontier_edge_area_max: 6
  frontier_area_min: 8
  frontier_area_max: 9
  min_frontier_area: 20
  max_frontier_angle_range_deg: 150
  region_equal_threshold: 0.95

scene_graph:
  confidence: 0.003
  nms_threshold: 0.1
  iou_threshold: 0.5
  obj_include_dist: 3.5
  target_obj_iou_threshold: 0.6
